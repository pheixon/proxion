<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Projects</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./videos.css" />
  <link rel="stylesheet" href="./collection.css" />
  <link rel="stylesheet" href="./projects.css" />
</head>
<body class="videos-page">

  <!-- Fade wrapper (used by both list + project view) -->
  <div id="page-fade" class="fade-container">

    <!-- LIST VIEW -->
    <div id="projects-list-view">

      <div id="projects-container" class="projects-container">
        <div id="projects-total" class="projects-total"></div>
        <div id="projects-updated" class="video-count"></div>
      </div>

      <div class="sort-bar-container"></div>
      <div id="sections-container"></div>

    </div>

    <!-- SINGLE PROJECT VIEW -->
    <div id="project-view" class="hidden">

      <div class="project-page">
        <div id="back-btn" class="watch-btn purple">
          ← back to projects
        </div>
      </div>

      <div id="project-sections-container" class="project-wide">
        <!-- injected by JS -->
      </div>

    </div>

  </div>

  <script src="./projects.js"></script>
</body>
</html>
