<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <base href="../">
  <title>my blog · proxion experimental</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/videos.css" />
  <link rel="stylesheet" href="css/collection.css" />
  <link rel="stylesheet" href="css/projects.css" />
  <link rel="stylesheet" href="css/blog.css" />
</head>

<body class="videos-page">

  <div id="page-fade" class="fade-container">

    <div id="editor" class="blog-editor orange hidden">
      <h2>create post</h2>
      <input id="post-title" type="text" placeholder="post title">
      <textarea id="post-content" placeholder="write markdown here..."></textarea>
      <h5>preview</h5>
      <div id="preview" class="post-preview"></div>
      <span id="publish-post" class="watch-btn orange">publish</span>
    </div>

    <div class="sort-bar-container"></div>

    <div id="blog-container" class="project-wide"></div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/marked.min.js"></script>
  <script src="js/purify.min.js"></script>
  <script src="js/html.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/blog.js"></script>
</body>

</html>
