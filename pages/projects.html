<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <base href="../">
  <title>My Projects</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/videos.css" />
  <link rel="stylesheet" href="css/collection.css" />
  <link rel="stylesheet" href="css/projects.css" />
</head>

<body class="videos-page">

  <div id="page-fade" class="fade-container">

    <div id="projects-list-view">
      <div id="projects-editor" class="blog-editor hidden">
        <h2>add project</h2>
        <div class="admin-edit-form">
          <input id="new-p-id" class="admin-field" placeholder="id (slug, e.g. my-project)">
          <input id="new-p-title" class="admin-field" placeholder="title">
          <input id="new-p-type" class="admin-field" placeholder="type">
          <input id="new-p-year" class="admin-field" placeholder="year">
          <input id="new-p-image" class="admin-field" placeholder="image url">
          <textarea id="new-p-images" class="admin-field" placeholder="extra images (one url per line)"></textarea>
          <input id="new-p-url" class="admin-field" placeholder="project url">
          <textarea id="new-p-desc" class="admin-field" placeholder="description"></textarea>
        </div>
        <span class="watch-btn purple" id="create-project-btn">add project</span>
      </div>

      <div id="projects-container" class="projects-container">
        <div id="projects-total" class="projects-total"></div>
        <div id="projects-updated" class="video-count"></div>
      </div>
      <div class="sort-bar-container"></div>
      <div id="sections-container"></div>
    </div>

    <div id="project-view" class="hidden">
      <div class="project-page">
        <div id="back-btn" class="watch-btn purple">
          ← back to projects
        </div>
      </div>
      <div id="project-sections-container" class="project-wide"></div>
    </div>

  </div>

  <script src="js/html.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/projects.js"></script>
</body>

</html>
