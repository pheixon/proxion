<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <title>My Collection</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/videos.css">
  <link rel="stylesheet" href="css/collection.css">
</head>
<body>

  <div class="videos-page">
    <div id="collection-editor" class="blog-editor hidden">
      <h2>add phone</h2>
      <div class="admin-edit-form">
        <input id="new-brand" class="admin-field" placeholder="brand">
        <input id="new-model" class="admin-field" placeholder="model">
        <input id="new-type" class="admin-field" placeholder="type">
        <input id="new-year" class="admin-field" placeholder="year" type="number">
        <input id="new-image" class="admin-field" placeholder="image url">
        <input id="new-aka" class="admin-field" placeholder="aka">
        <label class="admin-check"><input type="checkbox" id="new-article"> has wiki article</label>
        <label class="admin-check"><input type="checkbox" id="new-clone"> clone</label>
      </div>
      <span class="watch-btn green" onclick="createPhone()">add phone</span>
    </div>

    <div id="phones-container" class="phones-container">
      <div id="phones-total" class="phones-total"></div>
      <div id="phones-updated" class="video-count"></div>
    </div>
    <div class="sort-bar-container"></div>
    <div id="sections-container"></div>

    <div id="got-stuck-container" class="got-stuck hidden">
      <div class="got-stuck-label">got stuck?</div>
      <div id="standalone-back" class="load-more label green">
        ← go back
      </div>
    </div>
  </div>

  <script src="js/html.js"></script>
  <script src="js/collection.js"></script>
</body>
</html>
